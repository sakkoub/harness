apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-sample
  labels:
    app: harness-sample
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: harness-sample
  template:
    metadata:
      labels:
        app: harness-sample
    spec:
      containers:
        - name: harness-sample
          # Built locally into minikube with: minikube image build -t harness-sample:1.0.0 .
          image: harness-sample:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0.0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
