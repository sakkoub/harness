apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-sample
  labels:
    app: harness-sample
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: harness-sample
  template:
    metadata:
      labels:
        app: harness-sample
    spec:
      containers:
        - name: harness-sample
          # Filled from k8s/values.yaml, which Harness resolves to the image
          # the CI stage pushed (samerakk/harness-sample:<pipeline sequence id>).
          image: {{.Values.image}}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "{{.Values.version}}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
