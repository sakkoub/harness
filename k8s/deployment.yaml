apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-sample
  labels:
    app: harness-sample
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: harness-sample
  template:
    metadata:
      labels:
        app: harness-sample
    spec:
      containers:
        - name: harness-sample
          # Resolved by Harness at deploy time from the service's primary artifact
          # (docker.io/samerakk/harness-sample:<pipeline sequence id>, pushed by the CI stage).
          image: <+artifacts.primary.image>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "<+artifacts.primary.tag>"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
